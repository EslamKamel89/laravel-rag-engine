services:
    pgvector:
        build: .
        container_name: pgvectorapp_db
        environment:
            POSTGRES_DB: laravelappdb
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: mypassword101
        ports:
            - "5432:5432"
        volumes:
            - ./data/postgres:/var/lib/postgresql/data
    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: pgvectorapp_pgadmin
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@gmail.com
            PGADMIN_DEFAULT_PASSWORD: password
        ports:
            - "8080:80"
        volumes:
            - ./data/pgadmin:/var/lib/pgadmin
        depends_on:
            - pgvector
